name: AIラボ 15分類 AI News Notifier

on:
  schedule:
    # ★2026-09-03 実測: "15,45"(1日48回)の設定に対し、実際の実行は1日6〜9回まで間引かれていた
    #   (GitHub Actionsのscheduleは高負荷時に遅延・スキップされる仕様)。
    #   混雑しやすい 0/15/30/45分を避けた分に移し、15分毎(1日96回)へ増やして取りこぼしを減らす。
    #   ic_club_notify.yml(5,35)・notify.yml(*/30=0,30)とも重複しない。
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # ★2026-07-30 統一: pushする4本を同一groupにして「同時に走らせない」
  #   別groupだと同時実行→git pushがnon-fast-forwardで衝突→job failure→メール通知
  #   同一groupなら順番待ちになるので衝突そのものが発生しない
  group: discord-rss-notifier-repo-write
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ★2026-09-05 重複投稿の根本原因を実測で確定して修正。
          #   actions/checkout は既定で github.sha（＝run が【作成】された時点のSHA）を取る。
          #   concurrency で順番待ちしている間に前のrunが seen をcommitすると、
          #   待たされたrunは古いSHAをcheckout＝seenが巻き戻り、既出記事を再投稿していた。
          #   実測(9/5): 直近30本中5本がこれ(#98/#107/#114/#123/#125)。
          #        余分な投稿 9/3=34件 9/4=38件 9/5=13件。時間差の中央値4.2分。
          #   ref を明示すると【実行時点のブランチ先端】を取るのでズレが消える。
          #   ★発火の冗長性(Layer1/3/5)は一切削らない。ここ1箇所で止める。
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ★翻訳はrunner内のローカル推論(argostranslate)で行い、外部翻訳APIを叩かない(GIT完結)。
      #   モデル(en->ja)は初回のみ取得し、以後はキャッシュから復元して実行時間を抑える。
      - name: Cache argostranslate model
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: argos-en-ja-v1

      - name: Install dependencies
        run: pip install feedparser argostranslate

      - name: Run AIラボ notifier
        env:
          DISCORD_AILAB_WEBHOOK_OPENAI: ${{ secrets.DISCORD_AILAB_WEBHOOK_OPENAI }}
          DISCORD_AILAB_WEBHOOK_CLAUDE: ${{ secrets.DISCORD_AILAB_WEBHOOK_CLAUDE }}
          DISCORD_AILAB_WEBHOOK_GEMINI: ${{ secrets.DISCORD_AILAB_WEBHOOK_GEMINI }}
          DISCORD_AILAB_WEBHOOK_XAI: ${{ secrets.DISCORD_AILAB_WEBHOOK_XAI }}
          DISCORD_AILAB_WEBHOOK_COPILOT: ${{ secrets.DISCORD_AILAB_WEBHOOK_COPILOT }}
          DISCORD_AILAB_WEBHOOK_META: ${{ secrets.DISCORD_AILAB_WEBHOOK_META }}
          DISCORD_AILAB_WEBHOOK_CHINA: ${{ secrets.DISCORD_AILAB_WEBHOOK_CHINA }}
          DISCORD_AILAB_WEBHOOK_LOCAL: ${{ secrets.DISCORD_AILAB_WEBHOOK_LOCAL }}
          DISCORD_AILAB_WEBHOOK_IMGVID: ${{ secrets.DISCORD_AILAB_WEBHOOK_IMGVID }}
          DISCORD_AILAB_WEBHOOK_AUDIO: ${{ secrets.DISCORD_AILAB_WEBHOOK_AUDIO }}
          DISCORD_AILAB_WEBHOOK_TOOLS: ${{ secrets.DISCORD_AILAB_WEBHOOK_TOOLS }}
          DISCORD_AILAB_WEBHOOK_PAPERS: ${{ secrets.DISCORD_AILAB_WEBHOOK_PAPERS }}
          DISCORD_AILAB_WEBHOOK_GENERAL: ${{ secrets.DISCORD_AILAB_WEBHOOK_GENERAL }}
          DISCORD_AILAB_WEBHOOK_RELEASE: ${{ secrets.DISCORD_AILAB_WEBHOOK_RELEASE }}
          DISCORD_AILAB_WEBHOOK_WORLD: ${{ secrets.DISCORD_AILAB_WEBHOOK_WORLD }}
        run: python ailab_news_bot.py

      - name: Commit updated ailab_seen_urls.json (if changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ailab_seen_urls.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update ailab_seen_urls.json"
          # 同一リポジトリに4本のworkflowがpushするため衝突する。
          # pull --rebase してから最大3回リトライ(market_notify.ymlと同じ方式)
          PUSHED=no
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git push && { PUSHED=yes; break; }
            echo "Push retry $i"
            sleep 3
          done
          # ★2026-09-05 追加: pushが3回とも死ぬと seen が【静かに】失われ、
          #   数時間後に同じ記事がもう一度流れていた（実測 #125: 15:22に投稿→
          #   commitが存在しない→18:28に再投稿）。しかも run は success のままだった。
          #   ★exit 1 で落とす案は採らない。同一リポのpush衝突でjob failureを出すと
          #     GitHubのエラーメールが連続する事故が 2026-07-30 / 07-31 に起きている。
          #   ★代わりに「失敗を切っ掛けにして、同じ穴に落ちないルートへ入れる」。
          #     git push が死ぬ原因は detached HEAD と rebase衝突＝作業ツリーとブランチ。
          #     Contents API はそのどちらも使わない。
          if [ "$PUSHED" != "yes" ]; then
            echo "::warning::git push が通らなかった。別経路(Contents API)で保存する"
            python .github/save_seen_via_api.py
          fi
